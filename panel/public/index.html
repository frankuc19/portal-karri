<!DOCTYPE html>
<html lang="es">
<head>
<script src="/theme-init.js"></script>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Karri — Devoluciones</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="/socket.io/socket.io.js"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">

<script>
tailwind.config = {
  theme: { extend: {
    colors: {
      electric:        '#78fcd6',
      'electric-dim':  '#00ffb6',
      'green-wa':      '#00ff41',
      'dark-900':      '#ffffff',
      'dark-800':      '#ffffff',
      'dark-700':      '#ffffff',
      'dark-600':      '#f1f3f2',
      'dark-500':      '#f4f5f6',
      'dark-400':      '#e3e6e5',
      /* compat aliases — mantienen clases JS sin cambios */
      primary:                    '#78fcd6',
      'on-primary':               '#080b0a',
      error:                      '#dc2626',
      background:                 '#ffffff',
      'on-surface':               '#12181a',
      'on-surface-variant':       'rgba(15,23,22,0.5)',
      outline:                    'rgba(15,23,22,0.35)',
      'outline-variant':          'rgba(15,23,22,0.08)',
      'surface-container':        '#e3e6e5',
      'surface-container-low':    '#ffffff',
      'surface-container-lowest': '#ffffff',
      'surface-container-high':   '#f1f3f2',
      'surface-container-highest':'#f1f3f2',
    },
    fontFamily: {
      sans: ['Inter', 'sans-serif'],
      mono: ['"JetBrains Mono"', 'monospace'],
    },
  }}
}
</script>

</head>

<body>
<div class="flex h-screen overflow-hidden">

  <!-- ── Sidebar ─────────────────────────────────────────────── -->
  <aside id="sidebar" class="sidebar"></aside>

  <!-- ── Main ─────────────────────────────────────────────────── -->
  <div class="flex-1 flex flex-col min-w-0 overflow-hidden">

    <!-- TopBar -->
    <header style="background:#ffffff; border-bottom:1px solid rgba(15,23,22,0.08);"
            class="h-14 flex items-center justify-between px-5 flex-shrink-0 z-40">
      <div class="flex items-center gap-3">
        <span style="color:#059669;" class="flex items-center">
          <i data-lucide="undo-2" class="w-4 h-4"></i>
        </span>
        <h1 class="text-[15px] font-semibold" style="color:#12181a;">Devoluciones Falabella</h1>
      </div>
      <div class="flex items-center gap-2">
        <a href="https://docs.google.com/spreadsheets/d/1bQqJ2GAXkgaMBWiVTrNwZCb-Q70xvKgWOmIAbsXsG9E/edit?gid=1099007443#gid=1099007443"
           target="_blank" class="btn-secondary">
          <i data-lucide="table-2" class="w-3.5 h-3.5"></i>
          Abrir Sheet
        </a>
        <label class="btn-secondary cursor-pointer">
          <i data-lucide="upload" class="w-3.5 h-3.5"></i>
          Subir contactos
          <input type="file" accept=".csv" class="hidden" onchange="subirContactos(this)">
        </label>
        <button onclick="recargarDatos()" class="btn-secondary">
          <i data-lucide="refresh-cw" class="w-3.5 h-3.5"></i>
          Recargar
        </button>
        <span id="autoTimer" class="label ml-1">Auto 05:00</span>
      </div>
    </header>

    <!-- Content -->
    <div class="flex-1 flex overflow-hidden min-h-0">

      <!-- Dashboard -->
      <div class="flex-1 flex flex-col overflow-y-auto min-h-0 p-5 gap-4">

        <!-- Metrics -->
        <div class="grid grid-cols-4 gap-3">
          <div class="card">
            <p class="label mb-3">Patentes</p>
            <div class="flex items-end justify-between">
              <span id="metPatentes" class="text-3xl font-black" style="color:#059669;">—</span>
              <i data-lucide="car" class="w-5 h-5 opacity-30" style="color:#059669;"></i>
            </div>
          </div>
          <div class="card">
            <p class="label mb-3">Folios totales</p>
            <div class="flex items-end justify-between">
              <span id="metFolios" class="text-3xl font-black" style="color:#12181a;">—</span>
              <i data-lucide="file-text" class="w-5 h-5 opacity-30" style="color:rgba(15,23,22,0.4);"></i>
            </div>
          </div>
          <div class="card">
            <p class="label mb-3">Con número</p>
            <div class="flex items-end justify-between">
              <span id="metConNum" class="text-3xl font-black" style="color:#059669;">—</span>
              <i data-lucide="phone" class="w-5 h-5 opacity-30" style="color:#059669;"></i>
            </div>
          </div>
          <div class="card">
            <p class="label mb-3">Sin número</p>
            <div class="flex items-end justify-between">
              <span id="metSinNum" class="text-3xl font-black" style="color:#dc2626;">—</span>
              <i data-lucide="phone-off" class="w-5 h-5 opacity-30" style="color:#dc2626;"></i>
            </div>
          </div>
        </div>

        <!-- Sin número alert -->
        <div id="alertSin" class="hidden rounded-xl overflow-hidden"
             style="background:#ffffff; border:1px solid rgba(180,83,9,0.2);">
          <div onclick="toggleAlerta()" class="flex items-center justify-between px-4 py-3 cursor-pointer"
               style="border-bottom:0;">
            <div class="flex items-center gap-2">
              <i data-lucide="alert-triangle" class="w-4 h-4" style="color:#b45309;"></i>
              <span class="label" style="color:#b45309;">Patentes sin número</span>
            </div>
            <div class="flex items-center gap-2">
              <span id="alertBadge" class="badge badge-amber">0</span>
              <i id="alertChevron" data-lucide="chevron-down" class="w-4 h-4 transition-transform" style="color:rgba(15,23,22,0.4);"></i>
            </div>
          </div>
          <div id="alertBody" style="border-top:1px solid rgba(180,83,9,0.1);"></div>
        </div>

        <!-- Action bar -->
        <div class="flex items-center justify-between px-3 py-2.5 rounded-t-xl"
             style="background:#f1f3f2; border:1px solid rgba(15,23,22,0.08); border-bottom:none;">
          <div class="flex items-center gap-4">
            <label class="flex items-center gap-2 cursor-pointer">
              <input id="chkTodos" type="checkbox" onchange="selTodos(this.checked)"
                class="rounded w-4 h-4 cursor-pointer accent-[#78fcd6]">
              <span class="text-[12px] font-medium" style="color:rgba(15,23,22,0.7);">Seleccionar todos</span>
            </label>
            <div id="selBar" class="hidden items-center gap-2">
              <span id="selCount" class="label"></span>
              <button onclick="enviarSeleccionados()" class="btn-primary" style="padding:4px 12px;font-size:11px;">
                Enviar seleccionados
              </button>
              <button onclick="deselTodos()" class="btn-secondary" style="padding:4px 10px;font-size:11px;">
                Limpiar
              </button>
            </div>
          </div>
          <button id="btnEnviarTodos" onclick="confirmarEnviarTodos()" disabled class="btn-primary">
            <i data-lucide="send" class="w-3.5 h-3.5"></i>
            Enviar todos
          </button>
        </div>

        <!-- Table -->
        <div class="rounded-b-xl overflow-hidden"
             style="background:#ffffff; border:1px solid rgba(15,23,22,0.08); border-top:none;">
          <div id="progressBar" class="h-0.5" style="background:#f1f3f2;">
            <div id="progressFill" class="h-full transition-all duration-300" style="width:0%;background:#78fcd6;"></div>
          </div>
          <div class="overflow-x-auto">
            <table class="w-full text-left">
              <thead>
                <tr style="background:#f1f3f2; border-bottom:1px solid rgba(15,23,22,0.07);">
                  <th class="px-4 py-3 w-10"></th>
                  <th class="px-4 py-3 label">Patente</th>
                  <th class="px-4 py-3 label">Conductor</th>
                  <th class="px-4 py-3 label">Teléfono</th>
                  <th class="px-4 py-3 label text-center">Folios</th>
                  <th class="px-4 py-3 label">Estado</th>
                  <th class="px-4 py-3 label text-right">Acciones</th>
                </tr>
              </thead>
              <tbody id="tabla">
                <tr><td colspan="7" class="py-12 text-center label" style="color:rgba(15,23,22,0.3);">
                  Cargando datos...
                </td></tr>
              </tbody>
            </table>
          </div>
        </div>

      </div><!-- /dashboard -->

      <!-- ── Right sidebar ─────────────────────────────────────── -->
      <aside class="w-72 flex-shrink-0 flex flex-col"
             style="background:#ffffff; border-left:1px solid rgba(15,23,22,0.08);">

        <!-- WhatsApp panel -->
        <div class="p-4 flex flex-col gap-3" style="border-bottom:1px solid rgba(15,23,22,0.08);">
          <div class="flex items-center justify-between">
            <div class="flex items-center gap-2">
              <div id="waDot" class="w-2 h-2 rounded-full" style="background:#ef4444;"></div>
              <span id="waLabel" class="label" style="color:#dc2626;">Desconectado</span>
            </div>
            <div class="flex items-center gap-1.5">
              <button id="btnConectar" onclick="conectarWA()" class="btn-wa">Conectar</button>
              <button id="btnDesconectar" onclick="desconectarWA()" disabled class="btn-secondary" style="padding:5px 10px;font-size:11px;">Desc.</button>
            </div>
          </div>

          <!-- QR -->
          <div id="qrWrap" class="bg-white p-3 rounded-xl justify-center items-center mx-auto w-44 shadow-xl">
            <img id="qrImg" src="" class="w-full h-full">
          </div>

          <p id="waHint" class="text-[10px] text-center italic" style="color:rgba(15,23,22,0.35);">
            Conecta WhatsApp para enviar mensajes
          </p>
        </div>

        <!-- Log -->
        <div class="flex-1 flex flex-col p-4 overflow-hidden">
          <div class="flex items-center justify-between mb-3">
            <span class="label" style="color:#059669;">Log de envío</span>
            <button onclick="limpiarLog()" class="label cursor-pointer hover:text-black transition-colors">Limpiar</button>
          </div>
          <div id="log"
               class="flex-1 rounded-xl p-3 overflow-y-auto scrollbar-hide space-y-1"
               style="background:#ffffff; border:1px solid rgba(15,23,22,0.06); font-family:'JetBrains Mono',monospace; font-size:10px;">
            <p style="color:rgba(5,150,105,0.6); font-weight:600;">En espera...</p>
          </div>
        </div>

      </aside>
    </div><!-- /content -->
  </div><!-- /main -->
</div><!-- /root -->

<!-- ── Modal ──────────────────────────────────────────────────── -->
<div id="modal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-6"
     style="background:rgba(0,0,0,0.75);">
  <div class="card w-full max-w-2xl max-h-[82vh] flex flex-col shadow-2xl p-0 overflow-hidden"
       style="border-radius:14px;">
    <div class="flex items-start justify-between px-5 py-4"
         style="border-bottom:1px solid rgba(15,23,22,0.08);">
      <div>
        <h3 id="modalTitle" class="text-[13px] font-bold" style="color:#059669;">Vista previa</h3>
        <p id="modalMeta" class="text-[11px] mt-0.5" style="color:rgba(15,23,22,0.45);"></p>
      </div>
      <button onclick="cerrarModal()" class="label hover:text-black transition-colors cursor-pointer mt-0.5">✕</button>
    </div>
    <pre id="modalBody" class="flex-1 overflow-y-auto px-5 py-4 text-[12px] whitespace-pre-wrap"
         style="font-family:'JetBrains Mono',monospace; color:#12181a; background:#ffffff;"></pre>
    <div class="flex justify-end gap-2 px-5 py-4" style="border-top:1px solid rgba(15,23,22,0.08);">
      <button onclick="cerrarModal()" class="btn-secondary">Cerrar</button>
      <button id="btnModalEnviar" onclick="enviarDesdeModal()" disabled class="btn-primary">
        <i data-lucide="send" class="w-3.5 h-3.5"></i>
        Enviar este mensaje
      </button>
    </div>
  </div>
</div>

<script>
// ─── Estado global ────────────────────────────────────────────
const socket = io();
let datos = [];
let waEstadoActual = 'desconectado';
let seleccionados = new Set();
let ocultos = new Set();
let patenteModal = null;
let alertaAbierta = true;
let autoTimer = null;
let autoSecs = 300;

// ─── Auto-refresh ─────────────────────────────────────────────
function iniciarAutoTimer() {
  clearInterval(autoTimer);
  autoSecs = 300;
  autoTimer = setInterval(() => {
    autoSecs--;
    const m = String(Math.floor(autoSecs / 60)).padStart(2,'0');
    const s = String(autoSecs % 60).padStart(2,'0');
    document.getElementById('autoTimer').textContent = `Auto ${m}:${s}`;
    if (autoSecs <= 0) recargarDatos();
  }, 1000);
}

// ─── Datos ────────────────────────────────────────────────────
async function recargarDatos() {
  iniciarAutoTimer();
  document.getElementById('tabla').innerHTML =
    '<tr><td colspan="7" class="py-12 text-center label" style="color:rgba(15,23,22,0.3);">Cargando...</td></tr>';
  let raw, res;
  try {
    raw = await fetch('/api/datos');
    res = await raw.json();
  } catch { addLog('err','Respuesta invalida del servidor'); return; }
  if (!res.ok) { addLog('err', res.error); return; }
  datos = res.datos || [];
  actualizarWA(res.waEstado);
  renderTabla();
  renderMetrics();
  renderSinNumero();
}

function datosFiltrados() { return datos.filter(d => !ocultos.has(d.patente)); }

function renderMetrics() {
  const vis = datosFiltrados();
  document.getElementById('metPatentes').textContent = vis.length;
  document.getElementById('metFolios').textContent   = vis.reduce((a,d) => a + d.folios, 0);
  document.getElementById('metConNum').textContent   = vis.filter(d => d.numero).length;
  document.getElementById('metSinNum').textContent   = vis.filter(d => !d.numero).length;
}

function renderSinNumero() {
  const sinNum = datosFiltrados().filter(d => !d.numero);
  const el = document.getElementById('alertSin');
  if (!sinNum.length) { el.classList.add('hidden'); return; }
  el.classList.remove('hidden');
  document.getElementById('alertBadge').textContent = sinNum.length;
  document.getElementById('alertBody').innerHTML = sinNum.map(d => `
    <div class="flex items-center gap-3 px-4 py-3" style="border-bottom:1px solid rgba(180,83,9,0.08);">
      <span class="font-mono font-bold text-[13px] min-w-[70px]" style="color:#b45309;">${d.patente}</span>
      <span class="label min-w-[56px]">${d.folios} folio(s)</span>
      <div class="flex gap-2 flex-1">
        <input id="inp-sn-${d.patente}" type="tel" placeholder="56912345678" maxlength="15"
          class="input" style="font-size:12px;padding:5px 10px;"
          oninput="validarSN('${d.patente}')"
          onkeydown="if(event.key==='Enter') guardarNumero('${d.patente}')">
        <button id="btn-sn-${d.patente}" onclick="guardarNumero('${d.patente}')" disabled
          class="btn-primary" style="padding:5px 12px;font-size:11px;white-space:nowrap;">
          Guardar
        </button>
      </div>
    </div>`).join('');
}

function validarSN(pat) {
  const v = document.getElementById(`inp-sn-${pat}`).value.replace(/[+\s\-]/g,'');
  document.getElementById(`btn-sn-${pat}`).disabled = !/^\d{10,15}$/.test(v);
}

function toggleAlerta() {
  alertaAbierta = !alertaAbierta;
  document.getElementById('alertBody').style.display     = alertaAbierta ? '' : 'none';
  const ch = document.getElementById('alertChevron');
  ch.style.transform = alertaAbierta ? '' : 'rotate(-90deg)';
}

// ─── Tabla ────────────────────────────────────────────────────
function renderTabla() {
  const vis = datosFiltrados();
  const tbody = document.getElementById('tabla');
  if (!vis.length) {
    tbody.innerHTML = '<tr><td colspan="7" class="py-12 text-center label" style="color:rgba(15,23,22,0.3);">Sin datos</td></tr>';
    return;
  }

  tbody.innerHTML = vis.map(d => {
    const sel = seleccionados.has(d.patente);
    let rowCls = 'tbl-row';
    if (sel)                          rowCls += ' row-sel';
    else if (d.estadoSheet === 'ENVIADO') rowCls += ' row-enviado';
    else if (!d.numero)               rowCls += ' row-sinnum';

    // Estado badge
    let estadoHtml;
    if (d.estadoSheet === 'ENVIADO') {
      estadoHtml = `<div>
        <span class="badge badge-electric">Enviado</span>
        ${d.fechaSheet ? `<div class="label mt-1">${d.fechaSheet}</div>` : ''}
      </div>`;
    } else if (!d.numero) {
      estadoHtml = `<span class="badge badge-amber">Sin número</span>`;
    } else {
      estadoHtml = `<span class="badge badge-muted">Pendiente</span>`;
    }

    // Teléfono con edición inline
    const telHtml = d.numero
      ? `<div id="tel-display-${d.patente}" class="font-mono text-[12px]" style="color:rgba(15,23,22,0.6);">${formatTel(d.numero)}</div>
         <div id="ie-${d.patente}" class="hidden gap-1 items-center">
           <input id="ie-inp-${d.patente}" type="tel" value="${d.numero}" maxlength="15"
             class="input" style="width:130px;font-size:11px;padding:4px 8px;"
             onkeydown="if(event.key==='Enter') guardarNumeroTabla('${d.patente}'); else if(event.key==='Escape') cancelarEdit('${d.patente}')">
           <button onclick="guardarNumeroTabla('${d.patente}')" class="btn-primary" style="padding:4px 10px;font-size:10px;">OK</button>
           <button onclick="cancelarEdit('${d.patente}')" class="btn-secondary" style="padding:4px 8px;font-size:10px;">✕</button>
         </div>`
      : `<div class="flex gap-1 items-center">
           <input id="ie-inp-${d.patente}" type="tel" placeholder="56912345678" maxlength="15"
             class="input" style="width:130px;font-size:11px;padding:4px 8px;"
             onkeydown="if(event.key==='Enter') guardarNumeroTabla('${d.patente}')">
           <button onclick="guardarNumeroTabla('${d.patente}')" class="btn-primary" style="padding:4px 10px;font-size:10px;">OK</button>
         </div>`;

    return `<tr class="${rowCls}">
      <td class="px-4 py-3 text-center">
        <input type="checkbox" ${sel?'checked':''} onchange="toggleSel('${d.patente}',this.checked)"
          class="w-4 h-4 rounded cursor-pointer accent-[#78fcd6]">
      </td>
      <td class="px-4 py-3 font-mono font-bold text-[13px]" style="color:#059669;">${d.patente}</td>
      <td class="px-4 py-3 text-[13px]" style="color:rgba(15,23,22,0.65);">${d.nombre || '—'}</td>
      <td class="px-4 py-3">${telHtml}</td>
      <td class="px-4 py-3 text-center">
        <span class="badge badge-electric">${d.folios}</span>
      </td>
      <td class="px-4 py-3">${estadoHtml}</td>
      <td class="px-4 py-3 text-right">
        <div class="flex justify-end gap-1">
          <button onclick="verMensaje('${d.patente}')" class="btn-secondary" style="padding:4px 10px;font-size:11px;">Ver</button>
          ${d.numero ? `<button onclick="editarNumero('${d.patente}')" class="btn-secondary" style="padding:4px 10px;font-size:11px;">Editar</button>` : ''}
          ${d.numero ? `<button onclick="enviarUno('${d.patente}')" class="btn-primary" style="padding:4px 10px;font-size:11px;">Enviar</button>` : ''}
          <button onclick="quitar('${d.patente}')" class="btn-danger" style="padding:4px 10px;font-size:11px;">Quitar</button>
        </div>
      </td>
    </tr>`;
  }).join('');

  actualizarBotonesEnvio();
}

// ─── Acciones tabla ───────────────────────────────────────────
function editarNumero(pat) {
  document.getElementById(`tel-display-${pat}`)?.classList.add('hidden');
  const ie = document.getElementById(`ie-${pat}`);
  if (ie) { ie.classList.remove('hidden'); ie.classList.add('flex'); }
  document.getElementById(`ie-inp-${pat}`)?.focus();
}

function cancelarEdit(pat) {
  document.getElementById(`tel-display-${pat}`)?.classList.remove('hidden');
  const ie = document.getElementById(`ie-${pat}`);
  if (ie) { ie.classList.add('hidden'); ie.classList.remove('flex'); }
}

async function guardarNumero(pat) {
  const inp = document.getElementById(`inp-sn-${pat}`);
  const tel = inp.value.replace(/[+\s\-]/g,'');
  const res = await fetch('/api/contactos/manual', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ patente: pat, telefono: tel }),
  }).then(r => r.json());
  if (res.ok) { addLog('ok', `Número guardado para ${pat}: ${tel}`); await recargarDatos(); }
  else        addLog('err', res.error);
}

async function guardarNumeroTabla(pat) {
  const inp = document.getElementById(`ie-inp-${pat}`);
  const tel = inp?.value.replace(/[+\s\-]/g,'');
  if (!/^\d{10,15}$/.test(tel)) {
    addLog('err', `Número inválido para ${pat} — usa formato 56912345678 (sin espacios ni +)`);
    inp?.focus();
    return;
  }
  const res = await fetch('/api/contactos/manual', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ patente: pat, telefono: tel }),
  }).then(r => r.json());
  if (res.ok) { addLog('ok', `Número guardado para ${pat}: ${tel}`); await recargarDatos(); }
  else        addLog('err', `Error guardando ${pat}: ${res.error}`);
}

function quitar(pat) {
  ocultos.add(pat);
  seleccionados.delete(pat);
  renderTabla(); renderMetrics(); renderSinNumero();
}

// ─── Selección ────────────────────────────────────────────────
function toggleSel(pat, checked) {
  checked ? seleccionados.add(pat) : seleccionados.delete(pat);
  actualizarSelBar();
}

function selTodos(val) {
  seleccionados.clear();
  if (val) datosFiltrados().forEach(d => seleccionados.add(d.patente));
  renderTabla(); actualizarSelBar();
}

function deselTodos() {
  seleccionados.clear();
  document.getElementById('chkTodos').checked = false;
  renderTabla(); actualizarSelBar();
}

function actualizarSelBar() {
  const bar = document.getElementById('selBar');
  const cnt = seleccionados.size;
  if (cnt > 0) {
    bar.classList.remove('hidden'); bar.classList.add('flex');
    document.getElementById('selCount').textContent = `${cnt} seleccionado(s)`;
  } else {
    bar.classList.add('hidden'); bar.classList.remove('flex');
  }
}

function actualizarBotonesEnvio() {
  const listo = waEstadoActual === 'listo';
  document.getElementById('btnEnviarTodos').disabled = !listo;
  document.getElementById('btnModalEnviar').disabled = !listo || !patenteModal;
}

// ─── Modal ────────────────────────────────────────────────────
async function verMensaje(pat) {
  const res = await fetch(`/api/mensaje/${pat}`).then(r => r.json());
  if (!res.ok) { addLog('err', res.error); return; }
  patenteModal = pat;
  document.getElementById('modalTitle').textContent = `PPU ${pat}`;
  document.getElementById('modalMeta').textContent  = res.numero ? `Enviar a: +${res.numero}` : 'Sin número registrado';
  document.getElementById('modalBody').textContent  = res.mensaje;
  actualizarBotonesEnvio();
  document.getElementById('modal').classList.remove('hidden');
}

function cerrarModal() {
  document.getElementById('modal').classList.add('hidden');
  patenteModal = null;
}

async function enviarDesdeModal() {
  if (!patenteModal) return;
  const pat = patenteModal;
  cerrarModal();
  await enviarUno(pat);
}

// ─── Envío ────────────────────────────────────────────────────
async function enviarUno(pat) {
  if (waEstadoActual !== 'listo') { addLog('err','WhatsApp no conectado'); return; }
  await fetch('/api/enviar', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ patentes:[pat] }) });
}

async function enviarSeleccionados() {
  if (!seleccionados.size || waEstadoActual !== 'listo') return;
  const lista = [...seleccionados];
  if (!confirm(`Enviar mensajes a ${lista.length} patente(s)?`)) return;
  await fetch('/api/enviar', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ patentes: lista }) });
}

async function confirmarEnviarTodos() {
  if (waEstadoActual !== 'listo') return;
  const con = datosFiltrados().filter(d => d.numero).length;
  if (!confirm(`Enviar mensajes a ${con} patentes con número?`)) return;
  await fetch('/api/enviar', { method:'POST', headers:{'Content-Type':'application/json'}, body:'{}' });
}

// ─── WhatsApp ─────────────────────────────────────────────────
function actualizarWA(estado) {
  waEstadoActual = estado;
  const dot   = document.getElementById('waDot');
  const label = document.getElementById('waLabel');
  const btnC  = document.getElementById('btnConectar');
  const btnD  = document.getElementById('btnDesconectar');
  const qrW   = document.getElementById('qrWrap');
  const hint  = document.getElementById('waHint');

  const cfg = {
    desconectado: { color:'#ef4444', lbl:'Desconectado', blink:false, btnC:'Conectar', dis:[false,true]  },
    conectando:   { color:'#f59e0b', lbl:'Conectando...', blink:true, btnC:'Cancelar', dis:[true,false] },
    qr:           { color:'#f59e0b', lbl:'Escanea el QR', blink:true, btnC:'Cancelar', dis:[true,false] },
    autenticado:  { color:'#f59e0b', lbl:'Autenticando...', blink:true, btnC:'Cancelar', dis:[true,false] },
    listo:        { color:'#78fcd6', lbl:'Conectado',    blink:false, btnC:'Conectar', dis:[true,false]  },
    error:        { color:'#ef4444', lbl:'Error',        blink:false, btnC:'Reconectar', dis:[false,true] },
  }[estado] || { color:'#ef4444', lbl:'Desconectado', blink:false, btnC:'Conectar', dis:[false,true] };

  dot.style.background = cfg.color;
  dot.className = `w-2 h-2 rounded-full${cfg.blink ? ' dot-blink' : ''}`;
  label.textContent = cfg.lbl;
  label.style.color = cfg.color;
  btnC.textContent = cfg.btnC;
  [btnC.disabled, btnD.disabled] = cfg.dis;
  if (estado !== 'qr') qrW.classList.remove('show');
  hint.textContent = estado === 'listo' ? 'WhatsApp listo para enviar'
    : estado === 'qr' ? 'Escanea el código QR con WhatsApp'
    : 'Conecta WhatsApp para enviar mensajes';
  actualizarBotonesEnvio();
}

async function conectarWA() {
  addLog('info','Iniciando conexión WhatsApp...');
  await fetch('/api/whatsapp/conectar', { method:'POST' });
}
async function desconectarWA() {
  await fetch('/api/whatsapp/desconectar', { method:'POST' });
}

// ─── Socket.io ────────────────────────────────────────────────
socket.on('wa_estado', ({ estado, qr, progreso, msg }) => {
  actualizarWA(estado);
  if (qr) {
    document.getElementById('qrImg').src = qr;
    document.getElementById('qrWrap').classList.add('show');
  }
  if (estado === 'conectando' && progreso != null) addLog('info', `Cargando... ${progreso}%`);
  if (estado === 'listo')        addLog('ok',  'WhatsApp conectado');
  if (estado === 'desconectado') addLog('err', 'WhatsApp desconectado');
  if (estado === 'error')        addLog('err', `Error: ${msg}`);
});

socket.on('datos_actualizados', ({ datos: d }) => {
  datos = d; renderTabla(); renderMetrics(); renderSinNumero();
  addLog('info', 'Datos actualizados');
});

socket.on('envio_inicio', ({ total }) => {
  const pb = document.getElementById('progressBar');
  pb.classList.add('show'); pb.style.display = 'block';
  document.getElementById('progressFill').style.width = '0%';
  addLog('info', `Enviando ${total} mensaje(s)...`);
});
socket.on('envio_log', ({ patente, ok, numero, msg, i, total }) => {
  if (i != null) document.getElementById('progressFill').style.width = `${Math.round(i/total*100)}%`;
  addLog(ok ? 'ok' : 'err', `${patente}${numero ? ' → '+numero : ''} — ${msg}`);
});
socket.on('envio_fin', ({ total, enviados }) => {
  addLog('ok', `Finalizado: ${enviados}/${total} enviados`);
  document.getElementById('progressBar').style.display = 'none';
});

// ─── Log ──────────────────────────────────────────────────────
function addLog(tipo, msg) {
  const log  = document.getElementById('log');
  const hora = new Date().toLocaleTimeString('es-CL');
  const color = tipo === 'ok'  ? '#78fcd6'
              : tipo === 'err' ? '#ef4444'
              : 'rgba(15,23,22,0.45)';
  const p = document.createElement('p');
  p.style.color = color;
  if (tipo !== 'info') p.style.fontWeight = '600';
  p.textContent = `[${hora}] ${msg}`;
  log.appendChild(p);
  log.scrollTop = log.scrollHeight;
  while (log.children.length > 200) log.removeChild(log.firstChild);
}

function limpiarLog() {
  document.getElementById('log').innerHTML =
    '<p style="color:rgba(5,150,105,0.5);font-weight:600;">En espera...</p>';
}

// ─── Helpers ──────────────────────────────────────────────────
function formatTel(t) {
  const s = String(t).replace(/\D/g,'');
  if (s.startsWith('56') && s.length === 11) return `+56 ${s[2]} ${s.slice(3,7)} ${s.slice(7)}`;
  return '+' + s;
}

async function subirContactos(input) {
  const file = input.files[0]; if (!file) return;
  addLog('info', `Subiendo ${file.name}...`); input.value = '';
  const res = await fetch('/api/upload/contactos', {
    method:'POST', headers:{'Content-Type':'text/csv'}, body: file,
  }).then(r => r.json());
  if (res.ok) addLog('ok','Contactos cargados correctamente');
  else        addLog('err','Error: ' + res.error);
}

// ─── Init ─────────────────────────────────────────────────────
recargarDatos();
