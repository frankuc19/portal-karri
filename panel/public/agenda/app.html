<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<script>
/* Sincroniza el tema con el portal: claro por defecto, oscuro solo si el
   usuario lo eligió en el portal (localStorage karri_theme). Se fija de forma
   explícita para neutralizar el auto-oscuro por preferencia del sistema. */
try {
  var _t = localStorage.getItem('karri_theme');
  document.documentElement.setAttribute('data-theme', _t === 'dark' ? 'dark' : 'light');
} catch (e) { document.documentElement.setAttribute('data-theme', 'light'); }
/* Dentro del portal (iframe) la navegación la da la barra del portal. */
if (window.self !== window.top) document.documentElement.classList.add('embed');
</script>
<title>Karri Agenda</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: app shell (sidebar + workspace) for the backoffice; a separate single-column flow for the public booking page. Tokens mirror packages/ui/src/theme.css. */
:root {
  --bg: #f6f7fb;
  --surface: #ffffff;
  --surface-2: #f1f4f9;
  --fg: #0f172a;
  --muted: #526079;
  --border: #e1e6ef;
  --input: #cbd5e1;
  --primary: #1e40af;
  --primary-soft: #e6ecfb;
  --primary-fg: #ffffff;
  --accent: #d97706;
  --hatch: #eceff5;
  --danger: #b91c1c;
  /* semantic status colors */
  --st-pending-bg: #fef3c7; --st-pending-fg: #92400e;
  --st-confirmed-bg: #dbe5fd; --st-confirmed-fg: #1e3a8a;
  --st-checkin-bg: #ccf2ec; --st-checkin-fg: #0f5e55;
  --st-done-bg: #dcf3e2; --st-done-fg: #166534;
  --st-noshow-bg: #fde2e2; --st-noshow-fg: #991b1b;
  --st-cancel-bg: #eceff3; --st-cancel-fg: #5b6474;
  --shadow: 0 1px 2px rgba(15,23,42,.06), 0 8px 24px rgba(15,23,42,.08);
  --font-display: 'Space Grotesk', 'Inter', system-ui, sans-serif;
  --font-body: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --font-mono: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace;
  --radius: 8px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0b1120; --surface: #121a2e; --surface-2: #18223a; --fg: #e6ebf5; --muted: #98a4bd; --border: #26314b; --input: #34405c;
  --primary: #7d9cf5; --primary-soft: #1b2a52; --primary-fg: #0b1120; --accent: #f5b544; --hatch: #161f35; --danger: #f87171;
  --st-pending-bg: #3d2e0c; --st-pending-fg: #fcd581;
  --st-confirmed-bg: #1c2c58; --st-confirmed-fg: #b5c8fb;
  --st-checkin-bg: #0f3b37; --st-checkin-fg: #8ee6d8;
  --st-done-bg: #12361f; --st-done-fg: #92e0aa;
  --st-noshow-bg: #451818; --st-noshow-fg: #fca5a5;
  --st-cancel-bg: #222a3b; --st-cancel-fg: #9aa3b5;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
  color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #0b1120; --surface: #121a2e; --surface-2: #18223a; --fg: #e6ebf5; --muted: #98a4bd; --border: #26314b; --input: #34405c;
  --primary: #7d9cf5; --primary-soft: #1b2a52; --primary-fg: #0b1120; --accent: #f5b544; --hatch: #161f35; --danger: #f87171;
  --st-pending-bg: #3d2e0c; --st-pending-fg: #fcd581;
  --st-confirmed-bg: #1c2c58; --st-confirmed-fg: #b5c8fb;
  --st-checkin-bg: #0f3b37; --st-checkin-fg: #8ee6d8;
  --st-done-bg: #12361f; --st-done-fg: #92e0aa;
  --st-noshow-bg: #451818; --st-noshow-fg: #fca5a5;
  --st-cancel-bg: #222a3b; --st-cancel-fg: #9aa3b5;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 14px; line-height: 1.5; }
h1, h2, h3 { font-family: var(--font-display); line-height: 1.2; margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
h1 { font-size: 1.6rem; font-weight: 600; }
h2 { font-size: 1.1rem; font-weight: 600; }
h3 { font-size: .95rem; font-weight: 600; }
p { margin: 0; }
.mono { font-family: var(--font-mono); font-size: .85em; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.eyebrow { font-size: .7rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid var(--border); background: var(--surface); padding: 7px 12px; border-radius: var(--radius); cursor: pointer; font-weight: 500; white-space: nowrap; }
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--primary); color: var(--primary-fg); border-color: var(--primary); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.ghost:hover { background: var(--surface-2); }
.btn.danger { color: var(--danger); }
.btn.sm { padding: 4px 9px; font-size: .85rem; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field label { font-size: .8rem; font-weight: 600; }
.field .hint { font-size: .75rem; color: var(--muted); }
.field .err { font-size: .75rem; color: var(--danger); }
.input { border: 1px solid var(--input); background: var(--surface); border-radius: var(--radius); padding: 8px 10px; width: 100%; min-width: 0; }
.input:focus { outline: 2px solid var(--primary); outline-offset: -1px; border-color: transparent; }

.pill { display: inline-flex; align-items: center; gap: 6px; padding: 2px 9px; border-radius: 999px; font-size: .75rem; font-weight: 600; white-space: nowrap; }
.pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.st-PENDING { background: var(--st-pending-bg); color: var(--st-pending-fg); }
.st-CONFIRMED { background: var(--st-confirmed-bg); color: var(--st-confirmed-fg); }
.st-CHECKED_IN { background: var(--st-checkin-bg); color: var(--st-checkin-fg); }
.st-COMPLETED { background: var(--st-done-bg); color: var(--st-done-fg); }
.st-NO_SHOW { background: var(--st-noshow-bg); color: var(--st-noshow-fg); }
.st-CANCELLED { background: var(--st-cancel-bg); color: var(--st-cancel-fg); }
.tag { display: inline-block; padding: 1px 7px; border-radius: 4px; background: var(--surface-2); border: 1px solid var(--border); font-size: .72rem; color: var(--muted); font-weight: 500; }
.plate { font-family: var(--font-mono); font-size: .78rem; padding: 1px 6px; border: 1.5px solid var(--fg); border-radius: 4px; letter-spacing: .04em; background: var(--surface); }

/* ---------- Shell ---------- */
.sim-banner { background: var(--fg); color: var(--bg); font-size: .78rem; padding-block: 6px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.sim-banner button { background: transparent; border: 1px solid currentColor; color: inherit; border-radius: 999px; padding: 2px 10px; cursor: pointer; font-size: .75rem; }
.app { display: grid; grid-template-columns: 236px minmax(0, 1fr); min-height: calc(100% - 34px); }
.side { background: var(--surface); border-right: 1px solid var(--border); padding: 18px 12px; display: flex; flex-direction: column; gap: 18px; position: sticky; top: 0; height: 100vh; overflow: auto; }
.brand { display: flex; align-items: center; gap: 10px; padding: 0 6px; }
.logo { width: 32px; height: 32px; border-radius: 8px; background: var(--primary); color: var(--primary-fg); display: grid; place-items: center; font-family: var(--font-display); font-weight: 700; font-size: 1.05rem; }
.brand b { font-family: var(--font-display); font-size: 1.05rem; display: block; line-height: 1.1; }
.brand span { font-size: .72rem; color: var(--muted); }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav .grp { margin: 10px 8px 4px; }
.nav a { display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 6px; color: var(--fg); text-decoration: none; font-weight: 500; }
.nav a:hover { background: var(--surface-2); }
.nav a[aria-current="page"] { background: var(--primary-soft); color: var(--primary); }
.nav svg { width: 17px; height: 17px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.side .me { margin-top: auto; border-top: 1px solid var(--border); padding: 12px 6px 0; display: flex; flex-direction: column; gap: 8px; }
.me .who { display: flex; gap: 10px; align-items: center; min-width: 0; }
.avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--surface-2); border: 1px solid var(--border); display: grid; place-items: center; font-weight: 600; font-size: .8rem; flex: none; }
.me .who div { min-width: 0; }
.me .who b { display: block; font-size: .85rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.me .who span { font-size: .72rem; color: var(--muted); }

.main { min-width: 0; display: flex; flex-direction: column; }
.topbar { display: flex; align-items: center; gap: 12px; padding-block: 14px; padding-inline: 24px; border-bottom: 1px solid var(--border); background: var(--surface); flex-wrap: wrap; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; }
.topbar .title { flex: 1 1 220px; min-width: 0; }
.topbar .title p { font-size: .8rem; color: var(--muted); }
.content { padding: 24px; display: flex; flex-direction: column; gap: 20px; min-width: 0; }

.card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; min-width: 0; }
.card > header { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 14px 16px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
.card > .body { padding: 16px; }
details.fold > summary { list-style: none; cursor: pointer; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 14px 16px; flex-wrap: wrap; border-radius: 10px; }
details.fold > summary::-webkit-details-marker { display: none; }
details.fold[open] > summary { border-bottom: 1px solid var(--border); border-radius: 10px 10px 0 0; }
details.fold > summary:hover { background: color-mix(in srgb, var(--primary) 5%, transparent); }
details.fold > summary:focus-visible { outline: 2px solid var(--primary); outline-offset: -2px; }
.fold-title { display: flex; align-items: center; gap: 10px; min-width: 0; }
.chev { flex: none; width: 22px; height: 22px; display: grid; place-items: center; border-radius: 6px; border: 1px solid var(--border); color: var(--muted); transition: transform .15s ease; font-size: .7rem; }
details.fold[open] .chev { transform: rotate(90deg); }
.fold-bar { display: flex; gap: 6px; justify-content: flex-end; flex-wrap: wrap; }
.grid { display: grid; gap: 16px; }
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.kpi { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; display: flex; flex-direction: column; gap: 4px; }
.kpi .v { font-family: var(--font-display); font-size: 1.75rem; font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1.1; }
.kpi .d { font-size: .78rem; color: var(--muted); }
.two { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 16px; }

.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: .88rem; }
th { text-align: left; font-size: .72rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; padding: 10px 12px; border-bottom: 1px solid var(--border); white-space: nowrap; background: var(--surface); }
td { padding: 10px 12px; border-bottom: 1px solid var(--border); vertical-align: middle; }
tbody tr:last-child td { border-bottom: none; }
tbody tr.click { cursor: pointer; }
tbody tr.click:hover td { background: var(--surface-2); }
.filters { display: flex; gap: 10px; flex-wrap: wrap; align-items: end; }
.filters .field { flex: 1 1 160px; }

.list { display: flex; flex-direction: column; }
.row { display: grid; grid-template-columns: 64px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 10px 16px; border-bottom: 1px solid var(--border); cursor: pointer; }
.row:last-child { border-bottom: none; }
.row:hover { background: var(--surface-2); }
.row .t { font-family: var(--font-mono); font-size: .85rem; font-variant-numeric: tabular-nums; }
.row .s { font-size: .78rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row b { font-weight: 600; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.empty { padding: 28px 16px; text-align: center; color: var(--muted); }

/* ---------- Calendar ---------- */
.cal-tools { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.cal-scroll { overflow-x: auto; }
.cal { display: grid; position: relative; min-width: 100%; }
.cal-head { position: sticky; top: 0; z-index: 3; background: var(--surface); border-bottom: 1px solid var(--border); padding: 10px 10px; font-size: .82rem; min-width: 0; }
.cal-head b { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cal-head span { color: var(--muted); font-size: .72rem; }
.cal-gutter { position: relative; border-right: 1px solid var(--border); }
.cal-gutter span { position: absolute; right: 8px; font-family: var(--font-mono); font-size: .7rem; color: var(--muted); transform: translateY(-50%); }
.cal-col { position: relative; border-right: 1px solid var(--border); cursor: copy; background-image: repeating-linear-gradient(to bottom, transparent 0, transparent calc(var(--hour) - 1px), var(--border) calc(var(--hour) - 1px), var(--border) var(--hour)); }
.cal-col.ro { cursor: default; }
.closed { position: absolute; left: 0; right: 0; background: repeating-linear-gradient(135deg, var(--hatch) 0 6px, transparent 6px 12px); pointer-events: none; }
.ev { position: absolute; left: 4px; right: 4px; border-radius: 6px; padding: 4px 7px; font-size: .75rem; line-height: 1.3; overflow: hidden; cursor: pointer; border: 1px solid transparent; text-align: left; display: flex; flex-direction: column; gap: 1px; }
.ev:hover { filter: brightness(.97); border-color: currentColor; }
.ev b { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ev span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; opacity: .85; }
.now-line { position: absolute; left: 0; right: 0; height: 2px; background: var(--danger); z-index: 2; pointer-events: none; }
.now-line::before { content: ""; position: absolute; left: -4px; top: -3px; width: 8px; height: 8px; border-radius: 50%; background: var(--danger); }
.legend { display: flex; gap: 8px; flex-wrap: wrap; }

/* ---------- Drawer & modal ---------- */
.scrim { position: fixed; inset: 0; background: rgba(8, 13, 28, .45); z-index: 20; display: flex; justify-content: flex-end; }
.drawer { width: min(440px, 100%); height: 100%; background: var(--surface); box-shadow: var(--shadow); display: flex; flex-direction: column; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
.drawer > header { padding: 18px 20px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; gap: 12px; align-items: start; }
.drawer .body { padding: 18px 20px; overflow: auto; display: flex; flex-direction: column; gap: 18px; flex: 1; }
.drawer footer { padding: 14px 20px; border-top: 1px solid var(--border); display: flex; gap: 8px; flex-wrap: wrap; }
.dl { display: grid; grid-template-columns: 120px minmax(0, 1fr); gap: 8px 12px; font-size: .88rem; }
.dl dt { color: var(--muted); }
.dl dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.timeline { display: flex; flex-direction: column; gap: 10px; border-left: 2px solid var(--border); padding-left: 14px; margin-left: 4px; }
.timeline div { position: relative; font-size: .82rem; }
.timeline div::before { content: ""; position: absolute; left: -20px; top: 6px; width: 8px; height: 8px; border-radius: 50%; background: var(--primary); border: 2px solid var(--surface); }
.scrim.center { justify-content: center; align-items: center; padding: 16px; }
.modal { width: min(640px, 100%); max-height: 100%; overflow: auto; background: var(--surface); border-radius: 12px; box-shadow: var(--shadow); }
.modal > header { padding: 18px 20px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
.modal .body { padding: 18px 20px; display: flex; flex-direction: column; gap: 14px; }
.modal footer { padding: 14px 20px; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; gap: 8px; }
.form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.slots { display: grid; grid-template-columns: repeat(auto-fill, minmax(72px, 1fr)); gap: 6px; }
.slot { border: 1px solid var(--border); background: var(--surface); border-radius: 6px; padding: 7px 0; text-align: center; cursor: pointer; font-family: var(--font-mono); font-size: .82rem; font-variant-numeric: tabular-nums; }
.slot:hover { border-color: var(--primary); }
.slot[aria-pressed="true"] { background: var(--primary); color: var(--primary-fg); border-color: var(--primary); }

.toasts { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 40; display: flex; flex-direction: column; gap: 8px; max-width: calc(100% - 32px); }
.toast { background: var(--fg); color: var(--bg); padding: 10px 14px; border-radius: 8px; box-shadow: var(--shadow); font-size: .85rem; animation: tin .2s ease-out; }
@keyframes tin { from { transform: translateY(8px); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .toast { animation: none; } }

/* bars */
.bars { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(18px, 1fr); gap: 6px; align-items: end; height: 180px; padding-top: 8px; border-bottom: 1px solid var(--border); position: relative; }
.bar { display: flex; flex-direction: column-reverse; border-radius: 4px 4px 0 0; overflow: hidden; min-height: 2px; }
.bar i { display: block; }
.bar-labels { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(18px, 1fr); gap: 6px; font-size: .68rem; color: var(--muted); text-align: center; font-family: var(--font-mono); margin-top: 6px; }
.gridline { position: absolute; left: 0; right: 0; border-top: 1px dashed var(--border); font-size: .65rem; color: var(--muted); font-family: var(--font-mono); }
.gridline span { position: absolute; right: 0; top: -14px; }
.meter { height: 8px; background: var(--surface-2); border-radius: 999px; overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--primary); border-radius: 999px; }
.meter-row { display: grid; grid-template-columns: minmax(0, 150px) minmax(0, 1fr) 44px; gap: 10px; align-items: center; font-size: .85rem; }
.meter-row span:first-child { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.res-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
.week { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 3px; margin-top: 10px; }
.week div { font-size: .62rem; text-align: center; padding: 4px 0; border-radius: 4px; background: var(--surface-2); color: var(--muted); }
.week div.on { background: var(--primary-soft); color: var(--primary); font-weight: 600; }

/* ---------- Login ---------- */
.login { min-height: calc(100% - 34px); display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
.login-art { background: var(--primary); color: #fff; padding: 48px; display: flex; flex-direction: column; justify-content: space-between; gap: 32px; position: relative; overflow: hidden; }
.login-art h1 { font-size: 2.2rem; max-width: 14ch; }
.login-art p { max-width: 44ch; opacity: .85; }
.dock-art { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px; max-width: 420px; }
.dock-art div { height: 54px; border-radius: 4px; border: 1.5px solid rgba(255,255,255,.35); display: flex; align-items: end; justify-content: center; font-family: var(--font-mono); font-size: .7rem; padding-bottom: 4px; }
.dock-art div.busy { background: rgba(255,255,255,.18); }
.dock-art div.amber { background: #f5b544; color: #1e1b0f; border-color: #f5b544; }
.login-form { display: flex; align-items: center; justify-content: center; padding: 32px 16px; }
.login-form form { width: min(380px, 100%); display: flex; flex-direction: column; gap: 14px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--border); background: var(--surface); border-radius: 999px; padding: 4px 10px; font-size: .78rem; cursor: pointer; }
.chip[aria-pressed="true"] { border-color: var(--primary); color: var(--primary); background: var(--primary-soft); }
.alert { padding: 10px 12px; border-radius: var(--radius); background: var(--st-noshow-bg); color: var(--st-noshow-fg); font-size: .85rem; }

/* ---------- Public booking ---------- */
.pub { min-height: calc(100% - 34px); background: var(--bg); }
.pub-head { background: var(--surface); border-bottom: 1px solid var(--border); padding-block: 14px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.pub-head .in { max-width: 860px; margin: 0 auto; display: flex; align-items: center; gap: 12px; justify-content: space-between; flex-wrap: wrap; }

/* Deterministic generation of a branch-day of appointments */
function ensureDay(date, branch) {
  const key = date + branch;
  if (S.generated[key]) return; S.generated[key] = true;
  if (S.empty) return; // modo desde cero: solo reservas creadas manualmente
  if (holiday(date, branch) || !storeIv(branch, date).length) return;
  const r = rng(key);
  const persons = S.customers.filter((c) => c.type === 'PERSON');
  const companies = S.customers.filter((c) => c.type === 'COMPANY');
  if (!S.customers.length || !SERVICES.length) return;
  const cap = storeCap(branch);
  for (const [a, b] of storeIv(branch, date)) {
    for (let lane = 0; lane < cap; lane++) {
      let t = a + pick(r, [0, 0, 15, 30, 60, 90]);
      while (t < b) {
        const svc = pick(r, SERVICES);
        if (t + svc.dur > b) break;
        const c = svcCompany(svc) ? (companies.length ? pick(r, companies) : pick(r, persons)) : (persons.length ? pick(r, persons) : pick(r, companies));
        if (r() < 0.65 && c) addGen(r, date, t, svc, branch, c);
        t += svc.dur + svc.buffer + pick(r, [0, 15, 30, 45, 90, 150]);
      }
    }
  }
}
function statusFor(r, date, start, end) {

  if (date === TODAY && start <= NOW) return 'CHECKED_IN';
  const x = r(); return x < 0.74 ? 'CONFIRMED' : x < 0.92 ? 'PENDING' : 'CANCELLED';
}
function addGen(r, date, start, svc, branch, cust) {
  const end = start + svc.dur;

  const x = r(); const origin = x < 0.48 ? 'PUBLIC' : x < 0.84 ? 'BACKOFFICE' : x < 0.95 ? 'API' : 'IMPORT';
  const a = { id: 'a' + S.seq, code: 'KA-' + S.seq++, date, start, end, service: svc.id, branch, customer: cust.id, status, origin, plate: svc.plate ? cust.plate : null, notes: '', history: [] };

  if (['CHECKED_IN', 'COMPLETED'].includes(status)) a.history.push({ when: `${fmtDate(date)} ${hm(start - 6)}`, who: 'Recepción', what: 'Registró llegada' });
  if (status === 'COMPLETED') a.history.push({ when: `${fmtDate(date)} ${hm(end - 2)}`, who: 'Encargado de tienda', what: 'Marcó como completada' });
  if (status === 'NO_SHOW') a.history.push({ when: `${fmtDate(date)} ${hm(start + 20)}`, who: 'Sistema', what: 'Marcada como no asistió (20 min de tolerancia)' });

const ACTIVE = (a) => a.status !== 'CANCELLED' && a.status !== 'NO_SHOW';
function availability(svcId, date, branch) {
  const svc = svcById(svcId);
  const hoursIv = storeIv(branch, date);
  if (holiday(date, branch) || !hoursIv.length || date < TODAY) return [];
  const cap = storeCap(branch);
  const day = apptsFor(date, branch).filter(ACTIVE);
  const out = [];
  for (const [h0, h1] of hoursIv) for (let t = h0; t + svc.dur <= h1; t += 15) {
    if (date === TODAY && t < NOW + 30) continue;
    const s0 = t, s1 = t + svc.dur + svc.buffer;
    const overlap = day.filter((a) => { const ab = svcById(a.service).buffer; return a.start < s1 && s0 < a.end + ab; }).length;
    if (overlap < cap) out.push({ t, left: cap - overlap });
  }
  return out;
}

function viewCalendar() {
  if (S.real) return viewCalendarReal();
  if (!BRANCHES[S.branch]) return noStoreCfg('Calendario');
  const date = S.calDate; const branch = BRANCHES[S.branch];
  const cap = storeCap(S.branch);
  const day = apptsFor(date, S.branch).filter((a) => a.status !== 'CANCELLED').sort((a, b) => a.start - b.start || a.end - b.end);
  const closedReason = holiday(date, S.branch) ? `Feriado: ${holiday(date, S.branch)}` : !storeIv(S.branch, date).length ? 'Tienda cerrada' : '';
  const sh = shiftById(branch.shift);
  const ivAll = closedReason ? [] : storeIv(S.branch, date);
  const startMin = ivAll.length ? Math.floor(Math.min(...ivAll.map((x) => x[0])) / 60) * 60 : 480;
  const endMin = ivAll.length ? Math.ceil(Math.max(...ivAll.map((x) => x[1])) / 60) * 60 : 1140;
  const H = (endMin - startMin) * PPM;
  let gutter = ''; for (let m = startMin; m <= endMin; m += 60) gutter += `<span style="top:${(m - startMin) * PPM}px">${hm(m)}</span>`;
  // Greedy lane packing: each reservation goes to the first lane free at its start time.
  const laneEnd = [];
  day.forEach((a) => { let L = laneEnd.findIndex((e) => e <= a.start); if (L < 0) { L = laneEnd.length; laneEnd.push(0); } a._lane = L; laneEnd[L] = a.end; });

  if (cur < endMin) closed += `<div class="closed" style="top:${(cur - startMin) * PPM}px;height:${(endMin - cur) * PPM}px;left:0;right:0"></div>`;

  // Con muchos Karriers en el mismo turno, cada columna tiene un ancho mínimo y el calendario se desplaza a lo ancho.
  const colMin = Math.max(240, lanes * 150);
  const nowLine = date === TODAY && NOW > startMin && NOW < endMin ? `<div class="now-line" style="top:${(NOW - startMin) * PPM}px"></div>` : '';
  const html = `
    <section class="card">
      <header>
        <div class="cal-tools">
          <button class="btn sm" type="button" data-day="-1" aria-label="Día anterior">‹</button>
          <button class="btn sm" type="button" data-day="0">Hoy</button>
          <button class="btn sm" type="button" data-day="1" aria-label="Día siguiente">›</button>
          <h2 style="margin-left:6px;text-transform:capitalize">${fmtLong(date)}</h2>

        </div>
        <div class="legend">${['PENDING', 'CONFIRMED', 'CHECKED_IN', 'COMPLETED', 'NO_SHOW'].map(pill).join('')}</div>
      </header>
      <div class="cal-scroll">
        <div class="cal" style="--hour:${60 * PPM}px;grid-template-columns:56px minmax(${colMin}px, 1fr)">
          <div class="cal-head" style="border-right:1px solid var(--border)"></div>
          <div class="cal-head"><b>${esc(branch.name)}</b><span>${S.real ? `${day.length} ${day.length === 1 ? 'Karrier agendado' : 'Karriers agendados'} · cupos por turno hasta ${cap} · horario ${esc(sh.name.replace('Turnos ', ''))}` : `Capacidad ${cap} ${cap === 1 ? 'atención' : 'atenciones'} simultánea${cap === 1 ? '' : 's'} · turno ${esc(sh.name)}`}</span></div>
          <div class="cal-gutter" style="height:${H}px">${gutter}</div>
          <div class="cal-col ${can.write() ? '' : 'ro'}" data-cal style="height:${H}px">${closed}${evs}${nowLine}</div>
        </div>
      </div>
    </section>
    ${S.real ? `<p class="muted" style="font-size:.8rem">Cada bloque es un turno tomado en el link <b>/turnos</b>. Haz clic en uno para ver todos los datos del Karrier y registrar su asistencia (se guarda en Turnos). Las canceladas no se muestran en el calendario; están en Reservas.</p>` : `<p class="muted" style="font-size:.8rem">La reserva se asocia a la tienda, no a un andén; caben hasta ${cap} a la misma hora. ${can.write() ? 'Haz clic en un espacio libre para reservar a esa hora. ' : ''}Las franjas rayadas están fuera del horario de la tienda. Turno: ${esc(sh.name)}, ${shiftText(sh)}, ${daysText(sh.days).toLowerCase()}. Zona horaria ${COUNTRIES[branch.country].tz}.</p>`}`;
  return { title: 'Calendario', sub: S.real ? `${esc(branch.name)} · ${day.length} ${day.length === 1 ? 'turno agendado' : 'turnos agendados'}` : `${esc(branch.name)} · ${day.length} reservas activas · capacidad ${cap}`, html, actions: can.write() ? '<button class="btn primary" type="button" data-new>Nueva reserva</button>' : '',
    bind() {
      root.querySelectorAll('[data-day]').forEach((b) => b.onclick = () => { const d = Number(b.dataset.day); S.calDate = d === 0 ? TODAY : addDays(S.calDate, d); render(); });
      if (can.write()) { const col = root.querySelector('[data-cal]'); if (col) col.onclick = (e) => {

        const y = e.clientY - col.getBoundingClientRect().top; const t = startMin + Math.floor(y / PPM / 15) * 15;

/* ---- Reportes ---- */
function viewReportes() {
  if (!BRANCHES[S.branch]) return noStoreCfg('Reportes');
  const days = []; for (let i = 13; i >= 0; i--) days.push(addDays(TODAY, -i));
  const data = days.map((d) => { const l = apptsFor(d, S.branch); const c = (st) => l.filter((a) => a.status === st).length; return { d, done: c('COMPLETED'), noshow: c('NO_SHOW'), cancel: c('CANCELLED'), open: c('CHECKED_IN') + c('CONFIRMED') + c('PENDING') }; });
  const max = Math.max(...data.map((x) => x.done + x.noshow + x.cancel + x.open), 1);
  const top = Math.ceil(max / 10) * 10;
  const all = data.reduce((s, x) => ({ done: s.done + x.done, noshow: s.noshow + x.noshow, cancel: s.cancel + x.cancel }), { done: 0, noshow: 0, cancel: 0 });
  const range = apptsRange(days[0], TODAY, S.branch);
  const byOrigin = Object.keys(ORIGIN_LABEL).map((k) => ({ k, n: range.filter((a) => a.origin === k).length }));
  const bySvc = SERVICES.map((s) => ({ s, n: range.filter((a) => a.service === s.id && a.status !== 'CANCELLED').length })).filter((x) => x.n).sort((a, b) => b.n - a.n);
  const maxSvc = Math.max(...bySvc.map((x) => x.n), 1);
  const H = 180;
  const bars = data.map((x) => `<div class="bar" title="${fmtDate(x.d)}: ${x.done} completadas, ${x.noshow} no asistió, ${x.cancel} canceladas, ${x.open} abiertas">
     <i style="height:${(x.done / top) * H}px;background:var(--st-done-fg)"></i><i style="height:${(x.open / top) * H}px;background:var(--primary)"></i><i style="height:${(x.noshow / top) * H}px;background:var(--danger)"></i><i style="height:${(x.cancel / top) * H}px;background:var(--input)"></i></div>`).join('');
  const html = `
    <div class="kpis">
      <div class="kpi"><span class="eyebrow">Reservas · 14 días</span><span class="v">${range.length}</span><span class="d">${fmtDate(days[0])} al ${fmtDate(TODAY)}</span></div>
      <div class="kpi"><span class="eyebrow">Asistencia</span><span class="v">${Math.round((all.done / Math.max(1, all.done + all.noshow)) * 100)} %</span><span class="d">completadas / (completadas + no asistió)</span></div>
      <div class="kpi"><span class="eyebrow">No asistió</span><span class="v">${all.noshow}</span><span class="d">tolerancia de 20 min</span></div>
      <div class="kpi"><span class="eyebrow">Canceladas</span><span class="v">${all.cancel}</span><span class="d">${Math.round((all.cancel / Math.max(1, range.length)) * 100)} % del total</span></div>
    </div>
    <section class="card"><header><h2>Reservas por día</h2>
      <div class="legend" style="font-size:.75rem"><span><i style="display:inline-block;width:10px;height:10px;border-radius:2px;background:var(--st-done-fg)"></i> Completadas</span><span><i style="display:inline-block;width:10px;height:10px;border-radius:2px;background:var(--primary)"></i> Abiertas</span><span><i style="display:inline-block;width:10px;height:10px;border-radius:2px;background:var(--danger)"></i> No asistió</span><span><i style="display:inline-block;width:10px;height:10px;border-radius:2px;background:var(--input)"></i> Canceladas</span></div></header>
      <div class="body"><div style="overflow-x:auto"><div style="min-width:480px">
        <div class="bars" style="height:${H + 8}px"><div class="gridline" style="top:8px"><span>${top}</span></div><div class="gridline" style="top:${8 + H / 2}px"><span>${top / 2}</span></div>${bars}</div>
        <div class="bar-labels">${data.map((x) => `<span>${x.d.slice(8, 10)}</span>`).join('')}</div>
      </div></div></div></section>
    <div class="two">
      <section class="card"><header><h2>Por servicio</h2></header><div class="body grid" style="gap:10px">${bySvc.map((x) => `<div class="meter-row"><span>${esc(x.s.name)}</span><div class="meter"><i style="width:${(x.n / maxSvc) * 100}%"></i></div><span class="num muted" style="text-align:right">${x.n}</span></div>`).join('')}</div></section>
      <section class="card"><header><h2>Por canal</h2></header><div class="body grid" style="gap:10px">${byOrigin.map((x) => `<div class="meter-row"><span>${ORIGIN_LABEL[x.k]}</span><div class="meter"><i style="width:${(x.n / Math.max(1, range.length)) * 100}%"></i></div><span class="num muted" style="text-align:right">${Math.round((x.n / Math.max(1, range.length)) * 100)} %</span></div>`).join('')}</div></section>
    </div>`;
  return { title: 'Reportes', sub: `${BRANCHES[S.branch].name} · últimos 14 días`, html, actions: '<button class="btn" type="button" data-export>Exportar Excel</button>' };
}

root.addEventListener('change', (ev) => {

function formDefaults(kind, el) {

  if (kind === 'shift') return { name: '', start: '8', hours: '8', days: [1, 2, 3, 4, 5] };

}
root.addEventListener('click', (ev) => {

  if (ev.target.matches('[data-fscrim]')) { S.form = null; render(); return; }
  const el = ev.target.closest('[data-form],[data-as-admin],[data-fdel],[data-edit-country],[data-edit-store],[data-edit-shift],[data-edit-cust],[data-staff-toggle],[data-staff-reset],[data-doc],[data-block],[data-book-for],[data-fclose],[data-fsave]');
  if (!el) return; const d = el.dataset;

  else if (d.editStore) { const b = BRANCHES[d.editStore]; S.form = { kind: 'store', editId: b.id, errors: {}, values: { country: b.country, name: b.name, city: b.city, address: b.address, shift: b.shift, cap: String(b.cap || 1) } }; render(); }

  else if ('fdel' in d) deleteConfig(S.form);
  else if (d.editCountry) { const c = COUNTRIES[d.editCountry]; S.form = { kind: 'country', editId: c.code, errors: {}, values: { name: c.name, code: c.code, tz: c.tz, currency: c.currency } }; render(); }
  else if (d.editShift) { const t = shiftById(d.editShift); S.form = { kind: 'shift', editId: t.id, errors: {}, values: { name: t.name, start: String(t.start), hours: String(t.hours), days: t.days.slice() } }; render(); }
  else if (d.editCust) { const c = cust(d.editCust); S.form = { kind: 'customer', editId: c.id, errors: {}, values: { type: c.type, status: c.status, name: c.name, rut: rutDe(c), phone: fmtPhone(c.phone), email: c.email, tags: c.tags.join(', '), plate: c.plate || '', notes: c.notes || '', consent: c.consent } }; render(); }
  else if (d.staffToggle) { const u = S.staff.find((x) => x.id === d.staffToggle); if (u.status === 'INVITED') toast(`Invitación reenviada a ${u.email}`); else { u.status = u.status === 'ACTIVE' ? 'DISABLED' : 'ACTIVE'; toast(u.status === 'ACTIVE' ? `${u.name} reactivado` : `${u.name} desactivado: sus sesiones se cerraron`); } render(); }
  else if (d.staffReset) { const u = S.staff.find((x) => x.id === d.staffReset); toast(`Enlace para restablecer la contraseña enviado a ${u.email}`); }
  else if (d.doc) { cust(S.drawer.cust).docs[d.doc] = el.checked; render(); }
  else if (d.block) { const c = cust(d.block); c.status = c.status === 'BLOCKED' ? 'ACTIVE' : 'BLOCKED'; toast(c.status === 'BLOCKED' ? `${c.name} bloqueado: no podrá reservar` : `${c.name} desbloqueado`); render(); }
  else if (d.bookFor) { const id = d.bookFor; S.drawer = null; openNew({ custId: id }); }
  else if ('fclose' in d) { S.form = null; render(); }

});

/* ---- New appointment modal ---- */
function openNew(pre = {}) {
  // Con reservas reales, se agenda por el mismo link /turnos (respeta cupos por rol y reglas de Turnos).
  if (S.real) { S.drawer = null; S.modal = null; S.publicMode = true; render(); toast('Las reservas se toman en el link /turnos con el RUT del Karrier.'); return; }
  const firstCust = S.customers.find((c) => c.status !== 'BLOCKED');
  if (!pre.custId && !firstCust) { toast('Primero crea un cliente en la sección Clientes.'); return; }
  const svcId = pre.svcId || SERVICES[0].id;
  S.modal = { svcId, date: pre.date && pre.date >= TODAY ? pre.date : TODAY, t: null, custId: pre.custId || firstCust.id, plate: '', notes: '', err: '' };
  if (pre.t != null) {
    const sl = availability(svcId, S.modal.date, S.branch).find((x) => x.t === pre.t);
    if (sl) S.modal.t = pre.t; else S.modal.err = `No queda cupo a las ${hm(pre.t)}. Elige otro horario.`;
  }
  render();
}

        ${slots.length ? `<div class="slots">${slots.map((x) => `<button type="button" class="slot" data-slot="${x.t}" aria-pressed="${x.t === m.t}" title="${x.left} cupo(s) libre(s)">${hm(x.t)}</button>`).join('')}</div>` : `<p class="muted">${holiday(m.date, S.branch) ? 'Feriado: ' + holiday(m.date, S.branch) + '.' : 'Sin horarios disponibles este día.'}</p>`}</div>

function bindModal() {

  if (S.real) return;
  const b = S.bk;
  root.querySelector('[data-exit]').onclick = () => { S.publicMode = false; render(); };
  const pbr = document.getElementById('pub-branch'); if (!pbr) return;
  pbr.onchange = (e) => { S.branch = e.target.value; S.bk = { step: 1, service: null, date: null, slot: null, form: {}, errors: {}, result: null }; render(); };
  root.querySelectorAll('[data-svc]').forEach((el) => el.onclick = () => { b.service = el.dataset.svc; b.step = 2; b.date = null; b.slot = null; render(); });
  root.querySelectorAll('[data-date]').forEach((el) => el.onclick = () => { b.date = el.dataset.date; b.slot = null; render(); });
  root.querySelectorAll('[data-pslot]').forEach((el) => el.onclick = () => { b.slot = Number(el.dataset.pslot); render(); });
  root.querySelectorAll('[data-back]').forEach((el) => el.onclick = () => { b.step -= 1; render(); });
  root.querySelectorAll('[data-next]').forEach((el) => el.onclick = () => { b.step = 3; render(); });
  root.querySelectorAll('[data-again]').forEach((el) => el.onclick = () => { S.bk = { step: 1, service: null, date: null, slot: null, form: {}, errors: {}, result: null }; render(); });
  root.querySelectorAll('[data-see]').forEach((el) => el.onclick = () => { S.publicMode = false; S.loggedIn = true; if (!user().branches.includes(S.branch)) S.role = 'ADMIN'; S.route = 'calendario'; S.calDate = b.result.date; S.drawer = { appt: el.dataset.see }; S.bk = { step: 1, service: null, date: null, slot: null, form: {}, errors: {}, result: null }; render(); });
  const sub = root.querySelector('[data-submit]');
  if (sub) sub.onclick = () => {
    const v = (id) => (document.getElementById(id)?.value || '').trim();
    const f = { name: v('p-name'), rut: v('p-rut'), phone: v('p-phone'), email: v('p-email'), plate: v('p-plate'), lic: v('p-lic'), consent: document.getElementById('p-consent').checked };
    const svc = svcById(b.service); const e = {};
    if (f.name.split(/\s+/).length < 2) e.name = 'Escribe tu nombre y apellido.';
    const rut = parseRut(f.rut); if (!rut) e.rut = 'RUT inválido. Revisa el dígito verificador.';
    const phone = normPhone(f.phone); if (!phone) e.phone = 'Celular inválido. Usa el formato 9 1234 5678.';
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(f.email)) e.email = 'Correo inválido.';
    if (svc.plate && !validPlate(f.plate)) e.plate = 'Patente inválida. Ej.: LXJK45 o AB1234.';
    if (!f.consent) e.consent = 'Para reservar necesitamos tu consentimiento.';
    b.form = f; b.errors = e;
    if (Object.keys(e).length) { render(); return; }
    const sl = availability(svc.id, b.date, S.branch).find((x) => x.t === b.slot);
    if (!sl) { b.errors = {}; b.step = 2; b.slot = null; render(); toast('Ese horario se acaba de ocupar. Elige otro.'); return; }
    let c = S.customers.find((x) => x.rut === rut);
    if (!c) c = newCustomer({ name: f.name, rut, phone, email: f.email.toLowerCase(), license: f.lic || null, plate: f.plate ? normPlate(f.plate) : null, source: 'PUBLIC' });
    b.result = createAppt({ svcId: svc.id, date: b.date, t: b.slot, branch: S.branch, custId: c.id, plate: svc.plate ? f.plate : null, origin: 'PUBLIC', who: 'Cliente (página pública)' });
    b.step = 4; render();
  };
}

/* =================== Misc =================== */
function toast(msg) { const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.getElementById('toasts').appendChild(t); setTimeout(() => t.remove(), 3200); }
const VALID = ['calendario', 'reservas', 'clientes', 'tiendas', 'servicios', 'reportes', 'usuarios', 'integraciones'];
function fromHash() {
  const h = location.hash.slice(1); const eraPublica = S.publicMode;
  if (h === 'reservar') { S.publicMode = true; } else if (VALID.includes(h)) { S.publicMode = false; S.route = h; S.drawer = null; }
  render();
  // Al volver del link /turnos, trae los turnos recién tomados.
  if (S.real && eraPublica && !S.publicMode) cargarReales();
}
window.addEventListener('hashchange', fromHash);
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && (S.drawer || S.modal || S.form)) { if (S.form) S.form = null; else { S.drawer = null; S.modal = null; } render(); } });
document.getElementById('sim-public').onclick = () => { S.publicMode = !S.publicMode; document.getElementById('sim-public').textContent = S.publicMode ? 'Volver al backoffice' : 'Ver página pública de reservas'; render(); if (S.real && !S.publicMode) cargarReales(); };
document.getElementById('sim-reset').onclick = () => { boot(true); toast('Datos vaciados. Crea un país, un turno y una tienda para empezar.'); render(); };
document.getElementById('sim-role').onchange = (e) => { S.role = e.target.value; S.drawer = null; S.loggedIn = true; toast(`Ahora ves la app como ${ROLE_LABELS[S.role]}`); render(); };
document.getElementById('sim-demo').onclick = () => {
  if (S.real) { boot(false); fromHash(); toast('Datos demo cargados (no son reales)'); }
  else { S.loading = true; render(); cargarReales({ avisar: true }); }
};
document.getElementById('sim-refresh').onclick = () => cargarReales({ avisar: true });
// Arranca con las reservas reales de Turnos; si la API no responde, cae a la demo.
boot(false);
S.loading = true;
fromHash();
cargarReales();
// Refresco automático cada minuto (sin interrumpir si se está escribiendo o con un formulario abierto).
setInterval(() => {
  const ae = document.activeElement;
  if (!S.real || S.publicMode || S.modal || S.form || document.visibilityState !== 'visible') return;
  if (ae && ['INPUT', 'SELECT', 'TEXTAREA'].includes(ae.tagName)) return;
  cargarReales();
}, 60000);
</script>
