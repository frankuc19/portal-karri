<!DOCTYPE html>
<html lang="es">
<head>
<script src="/theme-init.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Karri — Asignaciones de Turnos</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
<style>
  .tbl-wrap { overflow-x:auto;border:1px solid rgba(15,23,22,.07);border-radius:10px; }
  table { width:100%;border-collapse:collapse;font-size:12.5px; }
  th { background:#f1f3f2;color:rgba(15,23,22,.35);font-weight:600;font-size:11px;letter-spacing:.04em;padding:9px 12px;text-align:left;white-space:nowrap;border-bottom:1px solid rgba(15,23,22,.07); }
  td { padding:9px 12px;border-bottom:1px solid rgba(15,23,22,.05);color:#12181a;vertical-align:middle;white-space:nowrap; }
  tr:last-child td { border-bottom:none; }
  tr:hover td { background:rgba(15,23,22,.02); }
  .week-nav { display:flex;align-items:center;gap:6px; }
  .week-btn { width:30px;height:30px;border-radius:8px;border:1px solid rgba(15,23,22,.08);background:#f1f3f2;color:#12181a;cursor:pointer;display:inline-flex;align-items:center;justify-content:center; }
  .week-btn:hover { background:#f4f5f6; }
  .btn-ghost { background:none;color:rgba(15,23,22,.5);font-size:12px;padding:5px 8px;border-radius:6px;border:none;cursor:pointer;display:inline-flex;align-items:center;gap:5px; }
  .btn-ghost:hover { background:#27272a1a;color:#12181a; }
  .modal-bg { position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:1000;padding:20px; }
  .modal { background:#ffffff;border:1px solid rgba(15,23,22,.07);border-radius:14px;width:100%;max-width:480px; }
  .modal-header { display:flex;align-items:center;justify-content:space-between;padding:18px 20px 14px;border-bottom:1px solid rgba(15,23,22,.07); }
  .modal-body { padding:20px;display:flex;flex-direction:column;gap:12px; }
  .modal-footer { display:flex;justify-content:flex-end;gap:8px;padding:14px 20px;border-top:1px solid rgba(15,23,22,.07); }
</style>
</head>
<body class="flex h-screen overflow-hidden">

<aside id="sidebar" class="sidebar"></aside>

<div class="flex-1 flex flex-col overflow-hidden">
  <header style="background:var(--bg-800);border-bottom:1px solid var(--border);padding:14px 24px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;flex-wrap:wrap;gap:10px;">
    <div>
      <h1 style="font-size:16px;font-weight:700;color:var(--text);">Asignaciones</h1>
      <p style="font-size:11px;color:var(--text-muted);margin-top:2px;">Modifica, reasigna o cancela la toma de turnos de los Karriers</p>
    </div>
    <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;">
      <select class="input" id="filtro-tienda" style="width:180px;" onchange="cargar()">
        <option value="">Todas las tiendas</option>
      </select>
      <select class="input" id="filtro-rol" style="width:130px;" onchange="cargar()">
        <option value="">Todos los roles</option>
        <option value="Picker">Picker</option>
        <option value="Shopper">Shopper</option>
        <option value="Driver">Driver</option>
      </select>
      <select class="input" id="filtro-estado" style="width:130px;" onchange="cargar()">
        <option value="ACTIVE">Activos</option>
        <option value="CANCELLED">Cancelados</option>
        <option value="">Todos</option>
      </select>
      <input type="date" class="input" id="filtro-dia" style="width:150px;" onchange="cargar()">
      <button class="btn-ghost" id="btn-limpiar-dia" onclick="limpiarDia()" title="Volver a vista por semana" style="display:none;"><i data-lucide="x" style="width:13px;height:13px;"></i> Día</button>
      <div class="week-nav" id="week-nav">
        <button class="week-btn" onclick="cambiarSemana(-7)"><i data-lucide="chevron-left" style="width:14px;height:14px;"></i></button>
        <button class="btn-secondary" onclick="irHoy()">Hoy</button>
        <button class="week-btn" onclick="cambiarSemana(7)"><i data-lucide="chevron-right" style="width:14px;height:14px;"></i></button>
      </div>
      <a class="btn-secondary" id="btn-descargar" href="#" target="_blank"><i data-lucide="download" style="width:13px;height:13px;"></i> Descargar</a>
    </div>
  </header>

  <div class="flex-1 overflow-y-auto" style="padding:20px 24px;display:flex;flex-direction:column;gap:16px;">
    <p id="rango-semana" style="font-size:12px;color:var(--text-muted);"></p>
    <div class="card" style="overflow:hidden;">
      <div class="tbl-wrap">
        <table>
          <thead><tr>
            <th>Karrier</th><th>RUT</th><th>Rol</th><th>Tienda</th><th>Fecha</th><th>Turno</th><th>Estado</th><th></th>
          </tr></thead>
          <tbody id="tbody-asig"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<!-- Modal reasignar -->
<div class="modal-bg hidden" id="modal-bg">
  <div class="modal">
    <div class="modal-header">
      <p style="font-size:14px;font-weight:700;">Reasignar turno</p>
      <button class="btn-ghost" onclick="cerrarModal()"><i data-lucide="x" style="width:16px;height:16px;"></i></button>
    </div>
    <div class="modal-body">
      <p style="font-size:12px;color:var(--text-muted);" id="modal-karrier"></p>
      <div class="form-group">
        <p class="label mb-1">Tienda destino</p>
        <select class="input" id="modal-tienda" onchange="cargarSlotsDestino()"></select>
      </div>
      <div class="form-group">
        <p class="label mb-1">Nuevo turno</p>
        <select class="input" id="modal-slot"></select>
      </div>
      <p id="modal-error" class="hidden" style="color:#dc2626;font-size:12px;"></p>
    </div>
    <div class="modal-footer">
      <button class="btn-secondary" onclick="cerrarModal()">Cancelar</button>
      <button class="btn-primary" onclick="confirmarReasignacion()"><i data-lucide="repeat" style="width:13px;height:13px;"></i> Reasignar</button>
    </div>
  </div>
</div>

<script src="/sidebar.js"></script>
<script>
const DIAS = ['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
const TURNO_LABEL = { AM:'AM', PM:'PM', FULL:'FULL', CAPACITACION:'Capacitación' };
let weekStart = mondayOf(new Date());
let tiendas = [];
let asignaciones = [];
let reasignandoId = null;
let reasignandoRol = null;

function mondayOf(d) {
  const day = d.getDay();
  const diff = day === 0 ? -6 : 1 - day;
  const m = new Date(d);
  m.setDate(m.getDate() + diff);
  return m.toISOString().slice(0, 10);
}
function fmtFecha(dateStr) {
  const d = new Date(dateStr + 'T00:00:00');
  return `${DIAS[d.getDay()]} ${d.getDate()}/${d.getMonth()+1}`;
}
function cambiarSemana(dias) {
  const d = new Date(weekStart + 'T00:00:00');
  d.setDate(d.getDate() + dias);
  weekStart = mondayOf(d);
  cargar();
}
function irHoy() { weekStart = mondayOf(new Date()); cargar(); }
function limpiarDia() { document.getElementById('filtro-dia').value = ''; cargar(); }

async function cargarTiendas() {
  const r = await fetch('/api/turnos/admin/tiendas').then(x => x.json());
  tiendas = r.tiendas || [];
  const sel = document.getElementById('filtro-tienda');
  const actual = sel.value;
  sel.innerHTML = '<option value="">Todas las tiendas</option>' + tiendas.map(t => `<option value="${t.id}">${t.name}</option>`).join('');
  sel.value = actual;
}

async function cargar() {
  const storeId = document.getElementById('filtro-tienda').value;
  const status = document.getElementById('filtro-estado').value;
  const role = document.getElementById('filtro-rol').value;
  const dia = document.getElementById('filtro-dia').value;

  document.getElementById('week-nav').style.display = dia ? 'none' : 'flex';
  document.getElementById('btn-limpiar-dia').style.display = dia ? 'inline-flex' : 'none';

  const params = new URLSearchParams();
  if (dia) {
    params.set('date', dia);
    document.getElementById('rango-semana').textContent = `Día ${fmtFecha(dia)}`;
  } else {
    params.set('weekStart', weekStart);
    const d = new Date(weekStart + 'T00:00:00');
    const fin = new Date(d); fin.setDate(fin.getDate() + 6);
    document.getElementById('rango-semana').textContent =
      `Semana del ${d.getDate()}/${d.getMonth()+1} al ${fin.getDate()}/${fin.getMonth()+1}`;
  }
  if (storeId) params.set('storeId', storeId);
  if (status) params.set('status', status);
  if (role) params.set('role', role);

  document.getElementById('btn-descargar').href = `/api/turnos/admin/asignaciones/export?${params}`;

  const r = await fetch(`/api/turnos/admin/asignaciones?${params}`).then(x => x.json());
  asignaciones = r.ok ? r.asignaciones : [];
  render();
}

function render() {
  const tbody = document.getElementById('tbody-asig');
  if (asignaciones.length === 0) {
    tbody.innerHTML = `<tr><td colspan="8" style="text-align:center;color:var(--text-faint);padding:24px;">Sin asignaciones para este filtro.</td></tr>`;
    return;
  }
  tbody.innerHTML = asignaciones.map(a => `
    <tr>
      <td style="font-weight:600;">${a.karrierName}</td>
      <td class="td-mono">${a.karrierRut}</td>
      <td>${a.role ? `<span class="badge badge-muted">${a.role}</span>` : '—'}</td>
      <td>${a.tienda?.name || '—'}</td>
      <td>${fmtFecha(a.slot.date)}</td>
      <td>${TURNO_LABEL[a.slot.shiftType]} · ${a.slot.startTime}-${a.slot.endTime}</td>
      <td>${a.status === 'ACTIVE' ? '<span class="badge badge-electric">Activo</span>' : '<span class="badge badge-muted">Cancelado</span>'}</td>
      <td style="display:flex;gap:4px;">
        ${a.status === 'ACTIVE' ? `
          <button class="btn-ghost" onclick='abrirReasignar(${JSON.stringify(a)})' title="Reasignar"><i data-lucide="repeat" style="width:13px;height:13px;"></i></button>
          <button class="btn-ghost" onclick='cancelar(${JSON.stringify(a.id)})' title="Cancelar"><i data-lucide="x-circle" style="width:13px;height:13px;"></i></button>
        ` : ''}
      </td>
    </tr>`).join('');
  if (window.lucide) lucide.createIcons({ el: tbody });
}

async function cancelar(id) {
  if (!confirm('¿Cancelar este turno? El cupo queda libre para otro Karrier.')) return;
  const r = await fetch(`/api/turnos/admin/asignaciones/${id}/cancelar`, {
    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ reason: 'Cancelado por operaciones' }),
  }).then(x => x.json());
  if (!r.ok) { alert(r.error || 'No se pudo cancelar'); return; }
  cargar();
}

function abrirReasignar(a) {
  reasignandoId = a.id;
  reasignandoRol = a.role || null;
  document.getElementById('modal-karrier').textContent = `${a.karrierName} (${a.karrierRut}) · ${a.role || 'sin rol'} — turno actual: ${fmtFecha(a.slot.date)} ${TURNO_LABEL[a.slot.shiftType]} en ${a.tienda?.name || '—'}`;
  const selTienda = document.getElementById('modal-tienda');
  selTienda.innerHTML = tiendas.map(t => `<option value="${t.id}" ${t.id === a.slot.storeId ? 'selected' : ''}>${t.name}</option>`).join('');
  document.getElementById('modal-error').classList.add('hidden');
  document.getElementById('modal-bg').classList.remove('hidden');
  cargarSlotsDestino(a.slotId);
  lucide.createIcons();
}
function cerrarModal() { document.getElementById('modal-bg').classList.add('hidden'); reasignandoId = null; }

async function cargarSlotsDestino(excluirSlotId) {
  const storeId = document.getElementById('modal-tienda').value;
  const selSlot = document.getElementById('modal-slot');
  selSlot.innerHTML = '<option>Cargando…</option>';
  const r = await fetch(`/api/turnos/admin/slots?storeId=${storeId}&weekStart=${weekStart}`).then(x => x.json());
  const rol = reasignandoRol;
  const disponibles = (r.ok ? r.slots : [])
    .filter(s => s.status === 'OPEN')
    .map(s => rol ? { ...s, available: s.porRol[rol].available, capacity: s.porRol[rol].capacity } : s)
    .filter(s => s.available > 0 || s.id === excluirSlotId);
  if (disponibles.length === 0) {
    selSlot.innerHTML = `<option value="">Sin turnos disponibles${rol ? ` para ${rol}` : ''} esta semana</option>`;
    return;
  }
  selSlot.innerHTML = disponibles.map(s => `<option value="${s.id}">${fmtFecha(s.date)} · ${TURNO_LABEL[s.shiftType]} (${s.available}/${s.capacity} cupos${rol ? ' ' + rol : ''})</option>`).join('');
}

async function confirmarReasignacion() {
  const newSlotId = document.getElementById('modal-slot').value;
  if (!newSlotId) return;
  const r = await fetch(`/api/turnos/admin/asignaciones/${reasignandoId}/reasignar`, {
    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ newSlotId }),
  }).then(x => x.json());
  if (!r.ok) {
    const err = document.getElementById('modal-error');
    err.textContent = r.error || 'No se pudo reasignar';
    err.classList.remove('hidden');
    return;
  }
  cerrarModal();
  cargar();
}

initSidebar('tu-asignaciones').then(async () => {
  lucide.createIcons();
  await cargarTiendas();
  await cargar();
});
</script>
</body>
</html>
