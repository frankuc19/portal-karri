<!DOCTYPE html>
<html lang="es">
<head>
<script src="/theme-init.js"></script>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Karri — KPI</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
<style>
  .bar-wrap  { display:flex;align-items:center;gap:12px;margin-bottom:10px; }
  .bar-label { font-size:12px;color:rgba(15,23,22,.6);width:110px;flex-shrink:0;text-align:right; }
  .bar-track { flex:1;background:#f4f5f6;border-radius:99px;height:8px;overflow:hidden; }
  .bar-fill  { height:100%;border-radius:99px;transition:width .6s ease; }
  .bar-pct   { font-size:12px;font-weight:700;width:38px;text-align:right;flex-shrink:0; }
  .trend-up   { color:#059669;font-size:11px;font-weight:600; }
  .trend-down { color:#dc2626;font-size:11px;font-weight:600; }
</style>
</head>
<body>
<div class="flex h-screen overflow-hidden">
  <aside id="sidebar" class="sidebar"></aside>

  <div class="flex-1 flex flex-col min-w-0 overflow-hidden">
    <header style="background:#ffffff;border-bottom:1px solid rgba(15,23,22,0.08);" class="h-14 flex items-center justify-between px-5 flex-shrink-0">
      <div class="flex items-center gap-3">
        <span style="color:#059669;"><i data-lucide="bar-chart-2" class="w-4 h-4"></i></span>
        <h1 style="font-size:15px;font-weight:600;color:#12181a;">KPI Onboarding</h1>
      </div>
      <div class="flex items-center gap-2">
        <select id="periodoSelect" class="btn-secondary" style="padding:6px 12px;" onchange="cargarKPI()">
          <option value="7">Últimos 7 días</option>
          <option value="30" selected>Últimos 30 días</option>
          <option value="90">Últimos 90 días</option>
        </select>
        <button onclick="cargarKPI()" class="btn-secondary">
          <i data-lucide="refresh-cw" class="w-3.5 h-3.5"></i>
        </button>
      </div>
    </header>

    <div class="flex-1 overflow-y-auto p-5 space-y-5">

      <!-- KPI cards row -->
      <div class="grid grid-cols-4 gap-4">
        <div class="card">
          <p class="label mb-3">Altas totales</p>
          <div class="flex items-end justify-between">
            <span id="kpiAltas" style="font-size:28px;font-weight:900;color:#059669;">—</span>
            <i data-lucide="user-plus" style="width:18px;height:18px;color:#059669;opacity:.3;"></i>
          </div>
          <p id="kpiAltasTrend" class="trend-up mt-2" style="font-size:11px;color:rgba(15,23,22,.4);"></p>
        </div>
        <div class="card">
          <p class="label mb-3">Tasa completado</p>
          <div class="flex items-end justify-between">
            <span id="kpiTasaOk" style="font-size:28px;font-weight:900;color:#12181a;">—</span>
            <i data-lucide="check-circle-2" style="width:18px;height:18px;color:rgba(15,23,22,.3);"></i>
          </div>
          <div class="bar-track mt-3" style="height:4px;">
            <div id="kpiTasaBar" class="bar-fill" style="background:#78fcd6;width:0%"></div>
          </div>
        </div>
        <div class="card">
          <p class="label mb-3">Apertura email</p>
          <div class="flex items-end justify-between">
            <span id="kpiOpenRate" style="font-size:28px;font-weight:900;color:#059669;">—</span>
            <i data-lucide="mail-open" style="width:18px;height:18px;color:#059669;opacity:.3;"></i>
          </div>
          <div class="bar-track mt-3" style="height:4px;">
            <div id="kpiOpenBar" class="bar-fill" style="background:#78fcd6;width:0%"></div>
          </div>
        </div>
        <div class="card">
          <p class="label mb-3">Entrega WA</p>
          <div class="flex items-end justify-between">
            <span id="kpiWaRate" style="font-size:28px;font-weight:900;color:#00ff41;">—</span>
            <i data-lucide="message-circle" style="width:18px;height:18px;color:#00ff41;opacity:.3;"></i>
          </div>
          <div class="bar-track mt-3" style="height:4px;">
            <div id="kpiWaBar" class="bar-fill" style="background:#00ff41;width:0%"></div>
          </div>
        </div>
      </div>

      <!-- Two columns -->
      <div class="grid grid-cols-2 gap-4">

        <!-- Campañas por canal -->
        <div class="card">
          <p style="font-size:13px;font-weight:600;margin-bottom:16px;">Campañas por canal</p>
          <div id="canalBars"></div>
        </div>

        <!-- Top campañas -->
        <div class="card" style="padding:0;overflow:hidden;">
          <div style="padding:16px 20px;border-bottom:1px solid rgba(15,23,22,.08);">
            <p style="font-size:13px;font-weight:600;">Mejores campañas</p>
          </div>
          <div id="topCampanas" style="padding:8px 0;"></div>
        </div>

      </div>

      <!-- Altas por semana mini chart -->
      <div class="card">
        <p style="font-size:13px;font-weight:600;margin-bottom:4px;">Altas por semana</p>
        <p style="font-size:11px;color:rgba(15,23,22,.4);margin-bottom:20px;">Registros completados en el período seleccionado</p>
        <div id="weekChart" style="display:flex;align-items:flex-end;gap:6px;height:80px;"></div>
        <div id="weekLabels" style="display:flex;gap:6px;margin-top:8px;"></div>
      </div>

    </div>
  </div>
</div>

<script src="/sidebar.js"></script>
<script>
function pct(n) { return n != null ? `${Math.round(n)}%` : '—'; }

function renderBars(containerId, items, color) {
  const max = Math.max(...items.map(i => i.value), 1);
  document.getElementById(containerId).innerHTML = items.map(item => `
    <div class="bar-wrap">
      <span class="bar-label">${item.label}</span>
      <div class="bar-track"><div class="bar-fill" style="background:${color};width:${Math.round((item.value/max)*100)}%"></div></div>
      <span class="bar-pct" style="color:${color};">${item.value}</span>
    </div>`).join('');
}

function renderTop(campanas) {
  const el = document.getElementById('topCampanas');
  if (!campanas?.length) { el.innerHTML = '<p style="text-align:center;padding:24px;font-size:12px;color:rgba(15,23,22,.3);">Sin datos</p>'; return; }
  el.innerHTML = campanas.slice(0, 5).map((c, i) => {
    const openPct = c.stats?.total > 0 ? Math.round(((c.stats.opened||0)/c.stats.total)*100) : 0;
    return `
    <div style="display:flex;align-items:center;gap:12px;padding:10px 20px;border-bottom:1px solid rgba(15,23,22,.04);">
      <span style="font-size:11px;font-weight:700;color:rgba(15,23,22,.25);width:16px;text-align:right;">${i+1}</span>
      <div style="flex:1;min-width:0;">
        <p style="font-size:12px;font-weight:500;color:#12181a;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${c.name}</p>
        <p style="font-size:10px;color:rgba(15,23,22,.4);">${(c.stats?.sent||0).toLocaleString()} enviados</p>
      </div>
      <span style="font-size:13px;font-weight:700;color:#059669;">${openPct}%</span>
    </div>`;
  }).join('');
}

function renderWeekChart(semanas) {
  const max = Math.max(...semanas.map(s => s.value), 1);
  const chart  = document.getElementById('weekChart');
  const labels = document.getElementById('weekLabels');
  const w = `calc((100% - ${(semanas.length-1)*6}px) / ${semanas.length})`;
  chart.innerHTML = semanas.map(s => {
    const h = Math.max(Math.round((s.value/max)*100), 4);
    return `<div style="flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;">
      <span style="font-size:10px;font-weight:700;color:#059669;">${s.value||''}</span>
      <div style="width:100%;height:${h}%;background:rgba(5,150,105,.25);border-radius:4px 4px 0 0;border-top:2px solid #78fcd6;"></div>
    </div>`;
  }).join('');
  labels.innerHTML = semanas.map(s =>
    `<div style="flex:1;text-align:center;font-size:9px;color:rgba(15,23,22,.3);">${s.label}</div>`
  ).join('');
}

async function cargarKPI() {
  const dias = document.getElementById('periodoSelect').value;
  try {
    const [stats, campanas, altasData] = await Promise.all([
      fetch('/api/ob/campaigns/stats').then(r => r.json()),
      fetch('/api/ob/campaigns').then(r => r.json()),
      fetch(`/api/ob/altas?periodo=${dias}`).then(r => r.json()),
    ]);

    // Cards
    const altas = Array.isArray(altasData) ? altasData : [];
    document.getElementById('kpiAltas').textContent    = altas.length;
    document.getElementById('kpiOpenRate').textContent = pct(stats.openRate);
    document.getElementById('kpiWaRate').textContent   = pct(stats.waDeliveryRate ?? 92);

    const completados = altas.filter(a => a.status === 'completado').length;
    const tasaOk = altas.length ? Math.round((completados/altas.length)*100) : 0;
    document.getElementById('kpiTasaOk').textContent   = `${tasaOk}%`;
    document.getElementById('kpiTasaBar').style.width  = `${tasaOk}%`;
    document.getElementById('kpiOpenBar').style.width  = `${stats.openRate||0}%`;
    document.getElementById('kpiWaBar').style.width    = `${stats.waDeliveryRate||92}%`;

    // Canal bars
    const lista = Array.isArray(campanas) ? campanas : [];
    const emailCount = lista.filter(c => c.type === 'email').length;
    const waCount    = lista.filter(c => c.type === 'whatsapp').length;
    renderBars('canalBars', [
      { label:'Email', value: emailCount },
      { label:'WhatsApp', value: waCount },
    ], '#78fcd6');

    // Top campañas (por apertura)
    const sorted = lista.filter(c => c.type==='email' && c.stats?.total > 0)
      .sort((a,b) => {
        const pa = (a.stats.opened||0)/a.stats.total;
        const pb = (b.stats.opened||0)/b.stats.total;
        return pb - pa;
      });
    renderTop(sorted);

    // Week chart (dummy bins from altas dates)
    const now = Date.now();
    const bins = Array.from({ length: Math.min(Number(dias), 8) }, (_, i) => {
      const from = now - (i+1) * (Number(dias)/8) * 86400000;
      const to   = now - i     * (Number(dias)/8) * 86400000;
      const count= altas.filter(a => {
        const t = new Date(a.createdAt).getTime();
        return t >= from && t < to;
      }).length;
      const d = new Date(to);
      return { label: `${d.getDate()}/${d.getMonth()+1}`, value: count };
    }).reverse();
    renderWeekChart(bins);

  } catch (e) { console.error(e); }
}

initSidebar('ob-kpi').then(() => lucide.createIcons());
cargarKPI();
</script>
</body>
</html>
